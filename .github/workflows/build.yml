name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Testy jednostkowe
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/release/app-release.apk Kalkulator.apk

      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kalkulator v${{ github.run_number }}
          files: Kalkulator.apk

      - name: Opublikuj w gałęzi apk (zapasowy link do pobrania)
        run: |
          mkdir apk-out && cp Kalkulator.apk apk-out/ && cd apk-out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add . && git commit -q -m "APK v${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
