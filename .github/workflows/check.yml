name: Check

# Sprawdzenie zmian na gałęziach roboczych (bez publikowania APK): testy, budowanie i test na emulatorze.
on:
  push:
    branches-ignore: [main, master, lab, apk, ci-log, 'lab-out*', check-out]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Model
        run: |
          pip -q install onnx onnxruntime numpy pillow matplotlib huggingface_hub
          python tools/prepare_model.py 2>&1 | tee model.log
      - name: Testy jednostkowe
        run: gradle testDebugUnitTest --no-daemon 2>&1 | tee test.log
      - name: APK do emulatora (arm64 + x86_64)
        run: |
          gradle assembleRelease -Pabis=arm64-v8a,x86_64 --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk e2e.apk
          python tools/e2e/photo.py '\frac{3}{4}+\frac{5}{6}' e2e_photo.png
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 3072
          script: bash tools/e2e/run.sh
      - name: Wyniki do gałęzi check-out
        if: always()
        run: |
          mkdir -p res && cp -r e2e res/ 2>/dev/null || true
          for f in model.log test.log build.log; do [ -f "$f" ] && tail -n 300 "$f" > "res/$f"; done
          find app/build/test-results -name '*.xml' -exec cp {} res/ \; 2>/dev/null || true
          cd res && git init -q -b check-out && git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m "wyniki ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" check-out
