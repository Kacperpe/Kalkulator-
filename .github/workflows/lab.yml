name: Lab
on:
  push:
    branches: [lab]
permissions:
  contents: write
jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip -q install onnx onnxruntime numpy pillow matplotlib huggingface_hub
      - run: python lab/lab.py prepare > out.txt 2>&1 || echo "EXIT $?" >> out.txt
      - run: pip -q install onnxruntime==1.19.2
      - run: python lab/lab.py eval >> out.txt 2>&1 || echo "EXIT $?" >> out.txt
      - if: always()
        run: |
          B=lab-out-$(uname -m)
          mkdir res && cp out.txt res/ && cp -r imgs res/ 2>/dev/null || true
          cd res && git init -q -b $B && git config user.name ci && git config user.email ci@example.com
          git add . && git commit -q -m out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B
